<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <style>
    /* Favicons render against the browser chrome, which has no inheritable colour,
       so this one resolves its own ink per theme instead of using currentColor. */
    .ink { stroke: #000000; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #FFFFFF; } }
  </style>

  <mask id="jh-cut-fav" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
    <rect width="64" height="64" fill="#fff"/>
    <circle cx="43" cy="44" r="15" fill="#000"/>
  </mask>

  <!-- Heavier strokes than the full logo: thin lines disappear at 16px. -->
  <g class="ink" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <g mask="url(#jh-cut-fav)">
      <path d="M16 5h17l14 14v28a7 7 0 0 1-7 7H16a7 7 0 0 1-7-7V12a7 7 0 0 1 7-7Z"/>
      <path d="M20 30h14"/>
      <path d="M20 40h10"/>
    </g>
    <circle cx="43" cy="44" r="10.5"/>
    <path d="M51 52 59 60" stroke-width="6"/>
  </g>
</svg>
